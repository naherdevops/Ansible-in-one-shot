
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#6a0dad;
      font-family:Arial,sans-serif;
      overflow:hidden;
    }

    h1{
      color:#fff;
      font-size:3rem;
      text-align:center;
      padding:20px 40px;
      border-radius:20px;
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(8px);
      box-shadow:0 0 25px rgba(255,255,255,0.3);
      animation:glow 2s infinite alternate;
    }

    span{
      color:#ff0000;
    }

    @keyframes glow{
      from{transform:scale(1);box-shadow:0 0 15px rgba(255,255,255,.3);}
      to{transform:scale(1.05);box-shadow:0 0 35px rgba(255,255,255,.7);}
    }
  </style>
</head>
<body>
  <h1>Hello Friends 🎬<br><span>You are Welcome</span></h1>
</body>
</html>
